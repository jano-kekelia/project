<!DOCTYPE html>

<title>removeChild Examples</title>
</head>
<body style="font-family:Arial; margin:40px;">

  <h2>🧩 მაგალითი 1: Remove first child from div</h2>

  <div id="content">
    <p>ეს არის პირველი ელემენტი</p>
    <p>ეს არის მეორე ელემენტი</p>

  </div>

  <hr>

  <h2>🧩 მაგალითი 2: Remove last child from ul</h2>

  <ul id="myList">
    <li>პირველი ელემენტი</li>
    <li>მეორე ელემენტი</li>
    <li>მესამე ელემენტი</li>
  </ul>

  <script src="homework.js"></script>
